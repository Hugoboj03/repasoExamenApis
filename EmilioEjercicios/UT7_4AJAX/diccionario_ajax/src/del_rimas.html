<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eliminar Rima</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-5">
    <h1>Eliminar una Rima</h1>
    <form id="delRimaForm" class="mb-3">
      <div>
        <label>Palabra</label>
        <input type="text" id="palabra" class="form-control" placeholder="Introduce la palabra a eliminar">
      </div>
      <button type="submit" class="btn btn-danger">Eliminar</button>
    </form>
    <a href="../index.html" class="btn btn-secondary">Volver al Menú</a>
  </div>
  <script src="./del_rimas.js"></script>
</body>
</html>
